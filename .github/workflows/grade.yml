name: Grade
on:
  push:
    paths: ["submissions/**"]
  workflow_dispatch:
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install -r requirements.txt
          pip install -e .
      - run: |
          mkdir -p results
          for f in submissions/*.xlsx; do
            n=$(basename "$f" .xlsx | sed 's/variant_//')
            pysheetgrader keys/key_$n.xlsx "$f" --score-output results/score_$n.txt --verbose || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: natijalar
          path: results/
